# The application's workspace: its screens and logic (starter-app, which
# also goes on the device) and the program that runs it in a browser window
# while you work (starter-dev, host only). Its protection domains are a
# workspace of their own, pds/, on the toolchain seL4's Rust support needs.

[workspace]
resolver = "3"
members = ["starter-app", "starter-dev"]
exclude = ["pds"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# NoWayOS, by path from the clone `make setup` fetches beside app/, at the
# commit nowayos.rev names. Cargo.lock cannot pin a path dependency's code:
# the rev file does.
nowayos-bounded = { path = "../nowayos/crates/nowayos-bounded", version = "=0.1.0" }
nowayos-display = { path = "../nowayos/crates/nowayos-display", version = "=0.1.0" }
nowayos-input = { path = "../nowayos/crates/nowayos-input", version = "=0.1.0" }
nowayos-ui = { path = "../nowayos/crates/nowayos-ui", version = "=0.1.0" }
# Host only: the renderer and frame for tests and the dev window.
nowayos-render-eg = { path = "../nowayos/crates/nowayos-render-eg", version = "=0.1.0" }
nowayos-dev-window = { path = "../nowayos/crates/nowayos-dev-window", version = "=0.1.0" }

starter-app = { path = "starter-app", version = "=0.1.0" }

# The lints NoWayOS holds its own code to (nowayos/tools/baseline.toml):
# code that runs on a device never panics on what it is given.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
panic_in_result_fn = "deny"
allow_attributes_without_reason = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[profile.dev]
panic = "abort"

[profile.release]
overflow-checks = true
panic = "abort"

# make dev: the application in a browser window. Your own code builds as in
# dev, so a save is rebuilt quickly; NoWayOS's layout and drawing are
# optimised, built once; and so is the small program that draws each frame.
[profile.dev-window]
inherits = "dev"

[profile.dev-window.package."*"]
opt-level = 3

[profile.dev-window.package.starter-dev]
opt-level = 3
