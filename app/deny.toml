# cargo-deny: the licences, sources, banned crates and advisories of every
# crate this application depends on. `make deny` runs it (and `make ci`),
# after NoWayOS's baseline check, which holds this file and Cargo.toml to
# NoWayOS's own settings (nowayos/tools/baseline.toml): stricter is allowed,
# weaker fails.
#
# Add a dependency and this is where you find out whether its licence, and
# the licence of everything it brings with it, is one you allow.

[graph]
# Every platform: stricter than checking only the platforms you build for.
targets = []
all-features = false
no-default-features = false

[advisories]
# Every vulnerability, unsound and unmaintained advisory is an error, whichever
# crate in the tree it concerns, and so is a yanked crate version, unless it is
# listed in `ignore` with the reason it does not apply.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# NoWayOS's list: permissive licences only. Narrow it if you wish; a licence
# outside it needs an exception below, one crate at a time, with its reason.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC"]
confidence-threshold = 0.93
# Dev-dependencies too.
include-dev = true
unused-allowed-license = "allow"
exceptions = [
    # NoWayOS's glyph outlines are made from its font, whose licence, the SIL
    # Open Font License, they keep.
    { crate = "nowayos-glyphs", allow = ["OFL-1.1"] },
]

[licenses.private]
# Your crates and NoWayOS's declare their licences and are checked like any
# other. Third-party code comes from crates.io only: the baseline check's
# local-crate guard fails on a local crate that is not yours or NoWayOS's.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# NoWayOS is a path dependency, at the commit nowayos.rev names; path
# dependencies of unpublished crates are not treated as wildcards.
allow-wildcard-paths = true
# NoWayOS's bans: nothing on the device's trusted path is a browser engine, a
# WebView, a window system or a C GUI runtime, so their usual crates are
# banned by name, where one can never arrive as a dependency of something
# else. The baseline check fails if one is missing here.
deny = [
    { crate = "wry", reason = "trusted-path non-negotiable: no WebView" },
    { crate = "webkit2gtk", reason = "trusted-path non-negotiable: no browser engine" },
    { crate = "webkit2gtk-sys", reason = "trusted-path non-negotiable: no browser engine" },
    { crate = "webview2-com", reason = "trusted-path non-negotiable: no WebView" },
    { crate = "servo", reason = "trusted-path non-negotiable: no browser engine" },
    { crate = "tao", reason = "trusted-path non-negotiable: no window system" },
    { crate = "winit", reason = "trusted-path non-negotiable: no window system" },
    { crate = "x11", reason = "trusted-path non-negotiable: no window system" },
    { crate = "x11-dl", reason = "trusted-path non-negotiable: no window system" },
    { crate = "x11rb", reason = "trusted-path non-negotiable: no window system" },
    { crate = "wayland-client", reason = "trusted-path non-negotiable: no window system" },
    { crate = "wayland-sys", reason = "trusted-path non-negotiable: no window system" },
    { crate = "gtk", reason = "trusted-path non-negotiable: no C GUI runtime" },
    { crate = "gtk4", reason = "trusted-path non-negotiable: no C GUI runtime" },
    { crate = "gtk-sys", reason = "trusted-path non-negotiable: no C GUI runtime" },
    { crate = "sdl2", reason = "trusted-path non-negotiable: no C GUI runtime" },
    { crate = "sdl2-sys", reason = "trusted-path non-negotiable: no C GUI runtime" },
    { crate = "minifb", reason = "trusted-path non-negotiable: no window system" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies here. seL4's Rust support is the one git source, and
# only for the protection domains (pds/deny.toml).
allow-git = []
